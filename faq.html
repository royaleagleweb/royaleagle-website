<script type="application/ld+json" data-id="faq">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How long does a typical website project take?","acceptedAnswer":{"@type":"Answer","text":"A standard marketing site takes 4–8 weeks from kickoff to launch; a large WordPress build or e-commerce site can run 10–16 weeks. We publish a week-by-week schedule on day one and you'll have visibility into every milestone."}},{"@type":"Question","name":"What's included in your monthly maintenance plans?","acceptedAnswer":{"@type":"Answer","text":"Weekly plugin/theme/core updates, malware scanning and firewall management, performance tuning, monthly editorial edits (up to 4 hours), quarterly accessibility and SEO audits, and priority support with a 4-hour first-response SLA."}},{"@type":"Question","name":"Do you work with businesses outside of South Florida?","acceptedAnswer":{"@type":"Answer","text":"Yes. The shop is in Lauderhill, just west of Fort Lauderdale, and most clients are nearby. Remote work is fine when the project fits."}},{"@type":"Question","name":"Can we keep our existing WordPress host?","acceptedAnswer":{"@type":"Answer","text":"Usually yes. We work with most managed WordPress hosts (WP-Engine, Kinsta, Pagely, Pressable). If you're on shared budget hosting that can't support our performance targets, we'll recommend a migration as part of the engagement."}},{"@type":"Question","name":"How do you price ongoing marketing engagements?","acceptedAnswer":{"@type":"Answer","text":"Marketing retainers are scoped to your needs and quoted custom. We bill ad media spend separately, at cost, with full transparency in monthly reports. There are no media markups, no kickbacks, no minimum-spend lock-ins."}},{"@type":"Question","name":"Do you offer 30-day money-back guarantees?","acceptedAnswer":{"@type":"Answer","text":"Yes — on hosting and maintenance plans we offer a 30-day money-back guarantee. On project work, we structure milestone payments so you can pause or exit the engagement after any completed phase."}},{"@type":"Question","name":"Who actually does the work — you or subcontractors?","acceptedAnswer":{"@type":"Answer","text":"Roy does the work. When a project needs extra hands — photography, a specialist developer, a specific ad-ops skill — he brings in people he trusts and tells you first. There is no fake org chart."}},{"@type":"Question","name":"Do you do white-label work for other agencies?","acceptedAnswer":{"@type":"Answer","text":"Yes, when it's a good fit. See the White Label page if you need a WordPress, Shopify, or AI build under your brand."}},{"@type":"Question","name":"What does an AI Strategy engagement actually deliver?","acceptedAnswer":{"@type":"Answer","text":"A four-week engagement produces a 30-page opportunity map, an ROI model for the top 10 AI use cases in your business, working prototypes of the top 3, and a 12-month implementation roadmap with vendor and build-vs-buy recommendations."}},{"@type":"Question","name":"Is my data safe with your AI workflows?","acceptedAnswer":{"@type":"Answer","text":"Yes. We deploy AI on enterprise tiers (Claude for Work, ChatGPT Enterprise, Azure OpenAI) where your data is never used for model training. We can also deploy private models on AWS Bedrock or self-host open-source models for clients with stricter data residency requirements."}},{"@type":"Question","name":"How does your affiliate program work?","acceptedAnswer":{"@type":"Answer","text":"We pay a 15% commission on the first 12 months of any client you refer. Tracked via FirstPromoter, paid monthly via PayPal or ACH."}},{"@type":"Question","name":"What is the typical engagement size?","acceptedAnswer":{"@type":"Answer","text":"Engagements range from monthly maintenance retainers up to full-funnel marketing operations across multiple locations. Every engagement is custom-quoted."}}]}</script>
